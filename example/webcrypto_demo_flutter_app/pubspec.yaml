name: webcrypto_example
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  convert: ^3.1.2
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter

  webcrypto:
    # When depending on this package from a real application you should use:
    #   webcrypto: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the repository root (two levels up) to use the current plugin's version.
    path: ../../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# TODO: Remove once package:boring 0.4.0 is published. Keep in sync with the
# dependency_overrides in ../../pubspec.yaml.
dependency_overrides:
  boring:
    git:
      url: https://github.com/mosuem/boring.git
      ref: 60072877a8ef9e3a504c4f4cb3cfb2abd5baae5e

flutter:
  uses-material-design: true
