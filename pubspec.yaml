name: webcrypto
version: 0.6.2-wip
description: Cross-platform implementation of Web Cryptography APIs for Dart.
repository: https://github.com/google/webcrypto.dart

environment:
  sdk: ^3.10.0

dependencies:
  boring: ^0.4.0
  meta: ^1.3.0

dev_dependencies:
  test: ^1.30.0
  yaml: ^3.0.0
  flutter_lints: ^6.0.0
  coverage: any # we only need format_coverage, don't care what version

# TODO: Remove once package:boring 0.4.0 is published. Keep in sync with
# example/webcrypto_demo_flutter_app/pubspec.yaml.
dependency_overrides:
  boring:
    git:
      url: https://github.com/mosuem/boring.git
      ref: 60072877a8ef9e3a504c4f4cb3cfb2abd5baae5e

topics:
 - crypto
